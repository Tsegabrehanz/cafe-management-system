spring.application.name=cafe-backend
server.port=${PORT:8081}

# ---------------------------------------------------------------- Database
# Default: built-in H2 database stored in ./data/ (no installation needed).
# To use MySQL instead, run with the "mysql" profile (see application-mysql.properties).
spring.datasource.url=jdbc:h2:file:./data/cafe;MODE=MySQL;DATABASE_TO_LOWER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# Fill an empty database with a sample menu on first start
app.seed-sample-data=true

# ---------------------------------------------------------------- JWT
# Use a long random value in production, e.g.  openssl rand -base64 48
app.jwt.secret=${JWT_SECRET:change-me-this-is-a-dev-only-secret-of-at-least-32-bytes}
app.jwt.expiration-minutes=600

# ---------------------------------------------------------------- First admin (created on startup if none exists)
app.admin.email=${ADMIN_EMAIL:admin@cafe.com}
app.admin.password=${ADMIN_PASSWORD:admin123}
app.admin.name=Admin

# ---------------------------------------------------------------- Frontend / CORS
app.frontend-url=${FRONTEND_URL:http://localhost:4200}
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:4200}

# ---------------------------------------------------------------- Online ordering (public)
# Max orders one IP address may place per time window
app.online-order.max-per-window=5
app.online-order.window-minutes=10

# ---------------------------------------------------------------- Bills
app.cafe-name=Cafe Management System
app.currency=EUR

# ---------------------------------------------------------------- Email
# Off by default: emails (approval notices, temporary passwords) are written to the log.
# To send real mail with Gmail, create an App Password (Google Account > Security >
# 2-Step Verification > App passwords) and set MAIL_ENABLED=true plus the vars below.
app.mail.enabled=${MAIL_ENABLED:false}
app.mail.from=${MAIL_USERNAME:no-reply@cafe.local}
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
