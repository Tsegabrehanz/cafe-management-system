# Starts a local MySQL 8 for the backend:  docker compose up -d
services:
  mysql:
    image: mysql:8.4
    container_name: cafe-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: cafe
      MYSQL_ROOT_PASSWORD: root
      MYSQL_USER: cafe
      MYSQL_PASSWORD: cafe123
    ports:
      - "3306:3306"
    volumes:
      - cafe-mysql-data:/var/lib/mysql

volumes:
  cafe-mysql-data:
